name: Bug report
description: Output differs from Next.js, a crash, or a wrong fallback
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected vs actual. For output differences, include the route and both outputs (or a diff).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest component/page that shows the problem, or a repository link.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: tsx2rs, Next.js, React, Node.js, OS
    validations:
      required: true
