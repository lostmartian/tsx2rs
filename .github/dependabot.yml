version: 2
# Commit messages follow Conventional Commits so Dependabot PRs pass the PR-title check:
# "build(deps): bump …" for Rust and npm, "ci(deps): bump …" for GitHub Actions.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups: { rust-minor: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups: { npm-minor: { update-types: [minor, patch] } }
    ignore:
      # typescript-eslint 8 supports TypeScript below 6.1 (see package.json)
      - dependency-name: typescript
        versions: [">=6.1.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
