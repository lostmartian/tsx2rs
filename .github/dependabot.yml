version: 2
# Commit messages follow Conventional Commits so Dependabot PRs pass the PR-title check:
# "build(deps): bump …" for Rust and npm (Dependabot uses "deps-dev" for npm devDependencies),
# "ci(deps): bump …" for GitHub Actions.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      # oxc's crates share one version and must move together. A 0.x bump (0.155 → 0.156) counts
      # as breaking, so the minor group below doesn't take it.
      oxc: { patterns: ["oxc*"] }
      rust-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
    groups:
      npm-minor:
        update-types: [minor, patch]
        # tsx2rs supports exactly one Next.js version (ADR-0021): moving it is its own PR, which
        # fails until the supported version moves with it.
        exclude-patterns: ["next", "@next/*"]
    ignore:
      # TypeScript is updated by hand. tsx2rs is on 6.0 (typescript-eslint 8 supports below 6.1);
      # the vendored Commerce app stays on the TypeScript it ships with (its tsconfig uses options
      # TypeScript 6 rejects). Dependabot treats them as one dependency and proposes one version
      # for both, a downgrade for one of them (#74).
      - dependency-name: typescript
      # Node.js type definitions follow the Node.js major in .node-version (24)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
