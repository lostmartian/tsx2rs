[workspace]
resolver = "3"
members = ["crates/*", "tests/differential"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/lostmartian/tsx2rs"
publish = false

[workspace.dependencies]
tsx2rs_ir = { path = "crates/ir" }
tsx2rs_compiler = { path = "crates/compiler" }
tsx2rs_engine = { path = "crates/engine" }
napi = { version = "3.15.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.13"
napi-build = "2.6.0"
thiserror = "2.0.21"
ryu-js = "1.0.3"
proptest = "1.12.0"
oxc_allocator = "0.155.0"
oxc_ast = "0.155.0"
oxc_ast_visit = "0.155.0"
oxc_parser = "0.155.0"
oxc_span = "0.155.0"
oxc_syntax = "0.155.0"
oxc_resolver = "11.24.3"
insta = "1.49.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# No crash-on-error shortcuts in library code (allowed in tests via clippy.toml).
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
