[package]
name = "tsx2rs_engine"
description = "Runs tsx2rs template programs, writing HTML and React Flight exactly as React does"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
ryu-js.workspace = true
thiserror.workspace = true
tsx2rs_ir.workspace = true

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# Valgrind runs only on Linux; elsewhere `instructions` is an empty benchmark.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun.workspace = true

[[bench]]
name = "render"
harness = false

[[bench]]
name = "instructions"
harness = false

[lints]
workspace = true
